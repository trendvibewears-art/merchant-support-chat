<html lang="en">
<head>

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .chat-container {
            background: white;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shopify-logo {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shopify-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-text h2 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }

        .agent-name-small {
            font-size: 13px;
            color: #95BF47;
            font-weight: 500;
        }

        .status {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #ccc;
        }

        .status-dot.online {
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Install PWA Banner */
        .install-prompt {
            background: #95BF47;
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-size: 14px;
            display: none;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .install-prompt.show {
            display: flex;
        }

        .install-prompt button {
            background: white;
            color: #95BF47;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Animated Logout Button */
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            color: #666;
            border: 1.5px solid #e5e5e5;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: #f5f5f5;
            border-color: #999;
            color: #333;
        }

        .logout-btn svg {
            transition: transform 0.2s ease;
        }

        .logout-btn:hover svg {

        }

            }

            }

                height: 20px;
            }

            flex-direction: column;
            justify-content: center;

            height: 100%;

            font-size: 24px;

            border-radius: 8px;

            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;

            left: 0;
            right: 0;

            font-size: 13px;

            color: #999;

            height: 6px;
            border-radius: 50%;
            background: #95BF47;
            animation: wave 1.4s infinite;
        }

        .contacting-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .contacting-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .message.customer {
            flex-direction: row-reverse;
        }

            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.customer .message-avatar {
            background: #e3f2fd;
            color: #0d47a1;
            border: 2px solid #bbdefb;
        }

        .message.admin .message-avatar {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #c8e6c9;
        }

        .message-content {

            display: flex;
            flex-direction: column;
        }

        .message.customer .message-content {
            align-items: flex-end;
        }

        .agent-name {
            font-size: 11px;
            font-weight: 600;
            color: #95BF47;
            margin-bottom: 2px;
        }

        .message-bubble {

            border-radius: 18px;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
            max-width: 100%;
            word-break: break-word;
        }

            background: #d1d5db;
            color: #333;
            border-bottom-right-radius: 4px;
        }

        .message.admin .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            border: 1px solid #e5e5e5;
        }

        .message-info {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
        }

        .typing-indicator {
            padding: 10px 15px;
            background: white;
            font-size: 13px;
            color: #666;
            display: none;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .typing-indicator.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .typing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            margin: 0 1px;
            animation: typing 1.4s infinite;

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-container {
            padding: 12px 15px;
            background: white;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 24px;
            font-size: 15px;
            background: #fafafa;
            min-height: 44px;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #95BF47;
            background: white;
        }

        .input-wrapper button {
            padding: 12px 20px;
            background: #95BF47;
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            white-space: nowrap;
            min-height: 44px;
        }

        .input-wrapper button:hover {
            background: #7fa33b;
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .shopify-footer {
            text-align: center;
            padding: 8px;
            font-size: 10px;
            color: #999;
            border-top: 1px solid #f0f0f0;
            background: white;
        }

        /* Dropdown Notification Banner */
        .dropdown-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #333;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10001;
            min-width: 320px;
            max-width: 90%;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: top 0.3s ease-out;
            border: 1px solid #e5e5e5;
        }

        .dropdown-notification.show {
            top: 20px;
        }

        .dropdown-notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e8f5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .dropdown-notification-content {
            flex: 1;
        }

        .dropdown-notification-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
            color: #333;
        }

        .dropdown-notification-message {
            font-size: 13px;
            color: #666;
        }

        .hidden {
            display: none !important;
        }

        .connection-error {
            background: #fee;
            color: #c33;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            display: none;
            flex-shrink: 0;
        }

        .connection-error.show {
            display: block;
        }

        @media (max-width: 768px) {
            .dropdown-notification {
                min-width: 280px;
                padding: 14px 20px;
            }
            
            .messages-container {
                padding-bottom: 70px;
            }
        }

        @supports (padding: max(0px)) {
            .input-container {
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
            
            .chat-header {
                padding-top: max(15px, env(safe-area-inset-top));
            }
        }
    </style>
</head>

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && !isPWA) {
                installPrompt.classList.add('show');
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installPrompt.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installPrompt.style.display = 'none';
            deferredPrompt = null;
        });

        // ==================== NOTIFICATION FUNCTIONS ====================

        function showInAppNotification(title, message) {
            if (notificationTimeout) clearTimeout(notificationTimeout);
            
            notifTitle.textContent = title;
            notifMessage.textContent = message;
            dropdownNotification.classList.add('show');
            
            notificationTimeout = setTimeout(() => {
                dropdownNotification.classList.remove('show');
            }, 5000);
            
            playNotificationSound();
        }

        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (error) {
                console.log('Audio error:', error);
            }
        }

        // ==================== AGENT ASSIGNMENT ====================
        async function assignAgentToCustomer() {
            const counterRef = ref(database, 'system/agentCounter');
            
            try {
                const snapshot = await get(counterRef);
                let counter = snapshot.exists() ? snapshot.val() : 0;
                
                const nextIndex = counter % AGENT_PERSONAS.length;
                const assignedAgent = AGENT_PERSONAS[nextIndex];
                
                await set(counterRef, counter + 1);
                
                console.log(`Customer assigned to: ${assignedAgent.name}`);
                return assignedAgent;
                
            } catch (error) {
                console.error('Error assigning agent:', error);
                const randomIndex = Math.floor(Math.random() * AGENT_PERSONAS.length);
                return AGENT_PERSONAS[randomIndex];
            }
        }

        messagesContainer.addEventListener('scroll', () => {
            const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 100;
            userScrolledUp = !isAtBottom;
        });

        // ==================== LOAD EVENT WITH RESUME SESSION ====================
        window.addEventListener('load', async () => {
            const savedSession = localStorage.getItem('customerSession');
            if (savedSession) {
                try {
                    const sessionData = JSON.parse(savedSession);
                    customerName = sessionData.name;
                    customerEmail = sessionData.email;
                    sessionId = sessionData.sessionId;
                    customerInitials = getInitials(customerName);
                    
                    console.log("✅ Resuming session:", {
                        name: customerName,
                        email: customerEmail,
                        sessionId: sessionId
                    });
                    
                    // Get fresh session data from Firebase
                    const sessionSnapshot = await get(ref(database, `sessions/${sessionId}`));
                    if (sessionSnapshot.exists()) {
                        const session = sessionSnapshot.val();
                        const agentId = session.assignedAgent;
                        assignedAgent = AGENT_PERSONAS.find(a => a.id === agentId);
                        if (assignedAgent) {
                            updateAgentUI(assignedAgent);
                            isAgentAssigned = true;
                        }
                    }
                    
                    welcomeScreen.classList.add('hidden');
                    chatScreen.classList.remove('hidden');
                    inputContainer.classList.remove('hidden');
                    logoutBtn.classList.remove('hidden');
                    
                    resumeSession();
                } catch (error) {
                    console.error('Error loading saved session:', error);
                    localStorage.removeItem('customerSession');
                }
            }
        });

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function updateAgentUI(agent) {
            agentNameSmall.textContent = agent.name;
        }

        function showConnectionError() {
            connectionError.classList.add('show');
            setTimeout(() => connectionError.classList.remove('show'), 5000);
        }

        function scrollToBottom() {
            setTimeout(() => {
                if (!userScrolledUp) {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            }, 100);
        }

        // ==================== FIXED RESUME SESSION ====================
        function resumeSession() {
            console.log("🔄 Resuming session:", sessionId);
            
            // Set online status
            set(ref(database, `sessions/${sessionId}/customerOnline`), true);
            onDisconnect(ref(database, `sessions/${sessionId}/customerOnline`)).set(false);
            
            // Clear and load messages
            messagesContainer.innerHTML = '<div class="date-divider">Today</div>';
            
            // Start listening for messages
            listenForMessages();
            
            // Force load existing messages
            get(ref(database, `sessions/${sessionId}/messages`)).then((snapshot) => {
                const messages = snapshot.val();
                if (messages) {
                    console.log(`📜 Found ${Object.keys(messages).length} existing messages`);
                } else {
                    console.log("📜 No existing messages");
                }
            });
            
            listenForAdminStatus();
            listenForAdminTyping();
            messageInput.focus();
        }

        logoutBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to logout? Your chat history will be saved and you can return anytime.')) {
                if (sessionId) {
                    set(ref(database, `sessions/${sessionId}/customerOnline`), false);
                }
                welcomeScreen.classList.remove('hidden');
                chatScreen.classList.add('hidden');
                inputContainer.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        // ==================== MAIN CHAT START ====================
        welcomeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const inputName = document.getElementById('customerName').value;
            const inputEmail = document.getElementById('customerEmail').value;

            customerName = inputName;
            customerEmail = inputEmail;
            customerInitials = getInitials(customerName);
            sessionId = push(ref(database, 'sessions')).key;
            
            console.log("✅ New session created:", {
                name: customerName,
                email: customerEmail,
                sessionId: sessionId
            });
            
            // Assign agent
            assignedAgent = await assignAgentToCustomer();
            
            // Create session with email
            await set(ref(database, `sessions/${sessionId}`), {
                customerName,
                customerEmail,
                startedAt: serverTimestamp(),
                customerOnline: true,
                adminOnline: false,
                unreadByAdmin: 0,
                archived: false,
                newCustomer: true,
                assignedAgent: assignedAgent.id
            });

            localStorage.setItem('customerSession', JSON.stringify({
                name: customerName,
                email: customerEmail,
                sessionId: sessionId
            }));

            set(ref(database, `sessions/${sessionId}/customerOnline`), true);
            onDisconnect(ref(database, `sessions/${sessionId}/customerOnline`)).set(false);

            // Send welcome message
            const joinRef = push(ref(database, `sessions/${sessionId}/messages`));
            await set(joinRef, {
                type: 'notification',
                text: `${customerName} joined the chat`,
                timestamp: serverTimestamp()
            });

            // Send greeting
            const greetingRef = push(ref(database, `sessions/${sessionId}/messages`));
            await set(greetingRef, {
                text: "An advisor will join in a moment. If you share some details, they'll be able to help you more quickly. What are you working on today?",
                sender: 'system',
                timestamp: serverTimestamp()
            });

            welcomeScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            inputContainer.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
            
            updateAgentUI(assignedAgent);
            
            listenForMessages();
            listenForAdminStatus();
            listenForAdminTyping();
            messageInput.focus();
            
            setTimeout(scrollToBottom, 500);
        });

        // ==================== SEND MESSAGE ====================
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            try {
                const messageRef = push(ref(database, `sessions/${sessionId}/messages`));
                set(messageRef, {
                    text: message,
                    sender: 'customer',
                    timestamp: serverTimestamp(),
                    read: false
                });

                get(ref(database, `sessions/${sessionId}`)).then((snapshot) => {
                    const data = snapshot.val();
                    set(ref(database, `sessions/${sessionId}/unreadByAdmin`), (data.unreadByAdmin || 0) + 1);
                });

                messageInput.value = '';
                userScrolledUp = false;
                stopTyping();
                scrollToBottom();
                
                if (!isAgentAssigned) {
                    showContactingIndicator();
                    
                    setTimeout(async () => {
                        await simulateAgentJoin();
                    }, 3000 + Math.random() * 2000);
                }
                
            } catch (error) {
                console.error('Error sending message:', error);
                showConnectionError();
            }
        }

        function showContactingIndicator() {
            const contactingDiv = document.createElement('div');
            contactingDiv.className = 'contacting-indicator';
            contactingDiv.id = 'contactingIndicator';
            contactingDiv.innerHTML = `
                <span>Contacting Advisor</span>
                <div class="contacting-dots">
                    <span class="contacting-dot"></span>
                    <span class="contacting-dot"></span>
                    <span class="contacting-dot"></span>
                </div>
            `;
            messagesContainer.appendChild(contactingDiv);
            scrollToBottom();
        }

        function removeContactingIndicator() {
            const indicator = document.getElementById('contactingIndicator');
            if (indicator) indicator.remove();
        }

        async function simulateAgentJoin() {
            if (isAgentAssigned) return;
            
            isAgentAssigned = true;
            removeContactingIndicator();
            
            // Agent joins notification
            const joinRef = push(ref(database, `sessions/${sessionId}/messages`));
            await set(joinRef, {
                type: 'notification',
                text: 'An advisor has joined the chat',
                timestamp: serverTimestamp()
            });
            
            // Agent greeting
            const greetingRef = push(ref(database, `sessions/${sessionId}/messages`));
            await set(greetingRef, {
                text: `Hello, this is ${assignedAgent.name}, your Shopify Support Advisor!`,
                sender: 'admin',
                senderName: assignedAgent.name,
                senderInitials: assignedAgent.initials,
                timestamp: serverTimestamp(),
                read: true
            });
            
            set(ref(database, `sessions/${sessionId}/adminOnline`), true);
            set(ref(database, `sessions/${sessionId}/unreadByAdmin`), 0);
            
            scrollToBottom();
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        messageInput.addEventListener('input', () => {
            if (!isTyping) {
                isTyping = true;
                set(ref(database, `sessions/${sessionId}/customerTyping`), true);
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(stopTyping, 1000);
        });

        function stopTyping() {
            isTyping = false;
            set(ref(database, `sessions/${sessionId}/customerTyping`), false);
        }

        // ==================== FIXED LISTEN FOR MESSAGES ====================
        function listenForMessages() {
            const messagesRef = ref(database, `sessions/${sessionId}/messages`);
            
            onValue(messagesRef, (snapshot) => {
                const messages = snapshot.val();
                
                // Clear and rebuild message list
                messagesContainer.innerHTML = '<div class="date-divider">Today</div>';
                
                const messageCount = messages ? Object.keys(messages).length : 0;
                
                if (messages) {
                    // Display all messages in order
                    Object.entries(messages).sort((a, b) => {
                        const timeA = a[1].timestamp || 0;
                        const timeB = b[1].timestamp || 0;
                        return timeA - timeB;
                    }).forEach(([id, msg]) => {
                        if (msg.type === 'notification') {
                            displayNotification(msg);
                        } else {
                            displayMessage(msg, id);
                        }
                        
                        if (msg.sender === 'admin' && !msg.read) {
                            set(ref(database, `sessions/${sessionId}/messages/${id}/read`), true);
                        }
                    });
                    
                    console.log(`📨 Displayed ${Object.keys(messages).length} messages`);
                }
                
                scrollToBottom();
                
                // Check for new messages (for notifications)
                if (messageCount > lastMessageCount) {
                    const lastMsg = messages ? Object.values(messages).pop() : null;
                    
                    if (lastMsg && lastMsg.sender === 'admin') {
                        const agentName = lastMsg.senderName || 'Support Team';
                        
                        // Show in-app notification
                        showInAppNotification(
                            `💬 New message from ${agentName}`,
                            lastMsg.text.substring(0, 100)
                        );
                        
                        // Send email if customer is not active
                        if (!isUserActive() && customerEmail) {
                            sendEmailToCustomer(
                                customerEmail,
                                agentName,
                                lastMsg.text,
                                `📱 Reply from ${agentName}`
                            );
                        }
                    }
                }
                lastMessageCount = messageCount;
            }, (error) => {
                console.error('Error listening for messages:', error);
                showConnectionError();
            });
        }

        function displayNotification(msg) {
            const notifDiv = document.createElement('div');
            notifDiv.className = 'join-notification';
            notifDiv.textContent = msg.text;
            messagesContainer.appendChild(notifDiv);
        }

        function displayMessage(msg, id) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            
            if (msg.sender === 'customer') {
                avatar.textContent = customerInitials;
            } else {
                avatar.textContent = msg.senderInitials || 'SP';
            }
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (msg.sender === 'admin' && msg.senderName) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'agent-name';
                nameDiv.textContent = msg.senderName;
                content.appendChild(nameDiv);
            }
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = msg.text;
            
            const info = document.createElement('div');
            info.className = 'message-info';
            
            const time = msg.timestamp ? formatTime(msg.timestamp) : 'now';
            const receipt = msg.read ? 'Seen' : 'Delivered';
            
            if (msg.sender === 'customer') {
                info.innerHTML = `<span>${time}, ${receipt}</span>`;
            } else {
                info.innerHTML = `<span>${time}</span>`;
            }
            
            content.appendChild(bubble);
            content.appendChild(info);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            messagesContainer.appendChild(messageDiv);
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = (now - date) / 1000;
            
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function listenForAdminStatus() {
            const statusRef = ref(database, `sessions/${sessionId}/adminOnline`);
            onValue(statusRef, (snapshot) => {
                const online = snapshot.val();
                if (online) {
                    adminStatus.classList.add('online');
                    statusText.textContent = 'Online';
                } else {
                    adminStatus.classList.remove('online');
                    statusText.textContent = 'Offline';
                }
            });
        }

        function listenForAdminTyping() {
            const typingRef = ref(database, `sessions/${sessionId}/adminTyping`);
            onValue(typingRef, (snapshot) => {
                const typing = snapshot.val();
                if (typing) {
                    typingIndicator.classList.add('show');
                } else {
                    typingIndicator.classList.remove('show');
                }
            });
        }
    </script>
</body>
</html>
